# Install as /etc/nginx/snippets/playne-domain-public.conf.
root /srv/playne/current/naglaz;
index index.html;
error_page 404 /404.html;

# Compress public pages and bundles, including requests from page-copy proxies.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/css application/javascript image/svg+xml;

location = /404.html {
    internal;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors https://metrika.yandex.ru https://metrica.yandex.ru https://analytics.yandex.ru https://metr.yandex.ru; form-action 'none'; script-src 'self' https://mc.yandex.ru https://mc.yandex.com https://yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mc.yandex.ru https://mc.yandex.com https://destroy.spritefusion.com; font-src 'self'; connect-src https://mc.yandex.ru https://mc.yandex.com https://mc.webvisor.com https://mc.webvisor.org wss://mc.yandex.ru wss://mc.yandex.com wss://mc.webvisor.com wss://mc.webvisor.org; frame-src blob: https://mc.yandex.ru; child-src blob: https://mc.yandex.ru; media-src 'none'; worker-src blob:; manifest-src 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
}


location ^~ /assets/ {
    try_files $uri @playne_previous_assets;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location @playne_previous_assets {
    root /srv/playne/previous/naglaz;
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /art/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors https://metrika.yandex.ru https://metrica.yandex.ru https://analytics.yandex.ru https://metr.yandex.ru; form-action 'none'; script-src 'self' https://mc.yandex.ru https://mc.yandex.com https://yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mc.yandex.ru https://mc.yandex.com https://destroy.spritefusion.com; font-src 'self'; connect-src https://mc.yandex.ru https://mc.yandex.com https://mc.webvisor.com https://mc.webvisor.org wss://mc.yandex.ru wss://mc.yandex.com wss://mc.webvisor.com wss://mc.webvisor.org; frame-src blob: https://mc.yandex.ru; child-src blob: https://mc.yandex.ru; media-src 'none'; worker-src blob:; manifest-src 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
}
