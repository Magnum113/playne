# Install as /etc/nginx/sites-available/playne and enable that site.
# The certificate covers the existing www.kadimag.ru address.
server {
    listen 80;
    listen [::]:80;
    server_name www.kadimag.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://kadimag.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kadimag.ru;

    ssl_certificate /etc/letsencrypt/live/kadimag.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kadimag.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/playne.access.log;
    error_log /var/log/nginx/playne.error.log;

    include /etc/nginx/snippets/playne-public.conf;
}
