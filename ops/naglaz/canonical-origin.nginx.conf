# Install as /etc/nginx/snippets/playne-canonical.conf.
# Included only by the kadimag.ru HTTPS server for existing game URLs.
location = /naglaz {
    return 308 https://www.kadimag.ru/naglaz/;
}

location ^~ /naglaz/assets/ {
    root /srv/playne/current;
    try_files $uri @naglaz_previous_assets;

    access_log off;
    expires 1y;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location @naglaz_previous_assets {
    root /srv/playne/previous;
    try_files $uri =404;

    access_log off;
    expires 1y;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Preserve direct artwork URLs from the original game address.
location ^~ /naglaz/art/ {
    root /srv/playne/current;
    try_files $uri =404;

    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /naglaz/ {
    return 308 https://www.kadimag.ru$request_uri;
}

