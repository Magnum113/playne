# Install as /etc/nginx/sites-available/playne-domain and enable the site.
server {
    listen 80;
    listen [::]:80;
    server_name playne.ru www.playne.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://playne.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.playne.ru;
    ssl_certificate /etc/letsencrypt/live/playne.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playne.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 308 https://playne.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name playne.ru;
    ssl_certificate /etc/letsencrypt/live/playne.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playne.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/playne.access.log;
    error_log /var/log/nginx/playne.error.log;

    include /etc/nginx/snippets/playne-domain-public.conf;
    location = /circle {
        return 308 https://playne.ru/circle/;
    }
    location = /naglaz {
        return 308 https://playne.ru/naglaz/;
    }
}
