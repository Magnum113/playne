# Install as /etc/nginx/snippets/playne-public.conf.
# Included only by the dedicated Playne www.kadimag.ru HTTPS server.
location = /naglaz {
    return 308 https://www.kadimag.ru/naglaz/;
}

location ^~ /naglaz/assets/ {
    root /srv/playne/current;
    try_files $uri @naglaz_www_previous_assets;

    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location @naglaz_www_previous_assets {
    root /srv/playne/previous;
    try_files $uri =404;

    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /naglaz/art/ {
    root /srv/playne/current;
    try_files $uri =404;

    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /naglaz/ {
    root /srv/playne/current;
    index index.html;
    try_files $uri $uri/ =404;

    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors https://metrika.yandex.ru https://metrica.yandex.ru https://analytics.yandex.ru https://metr.yandex.ru; form-action 'none'; script-src 'self' https://mc.yandex.ru https://mc.yandex.com https://yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mc.yandex.ru https://mc.yandex.com; font-src 'self'; connect-src https://mc.yandex.ru https://mc.yandex.com https://mc.webvisor.com https://mc.webvisor.org wss://mc.yandex.ru wss://mc.yandex.com wss://mc.webvisor.com wss://mc.webvisor.org; frame-src blob: https://mc.yandex.ru; child-src blob: https://mc.yandex.ru; media-src 'none'; worker-src blob:; manifest-src 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Keep this last inside the www HTTPS server.
location / {
    return 308 https://kadimag.ru$request_uri;
}
