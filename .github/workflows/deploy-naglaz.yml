name: Deploy Playne to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naglaz-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build exact SHA and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: naglaz-production

    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the exact source revision
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short)"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Build production assets
        run: npm run build

      - name: Validate the domain-root build
        id: assets
        run: |
          set -Eeuo pipefail
          test -f dist/index.html
          test -f dist/naglaz/index.html
          test -f dist/art/playne-logo.png
          test -f dist/favicon.svg

          while IFS= read -r -d '' entry; do
            relative="${entry#dist/}"
            if [[ -L "$entry" ]]; then
              printf 'Symbolic link in output: %s\n' "$relative" >&2
              exit 1
            elif [[ -d "$entry" ]]; then
              [[ "$relative" = 'assets' || "$relative" = 'art' || "$relative" = 'naglaz' ]] || {
                printf 'Unexpected output directory: %s\n' "$relative" >&2
                exit 1
              }
            elif [[ -f "$entry" ]]; then
              [[ "$relative" = 'index.html' || "$relative" = 'naglaz/index.html' || "$relative" = 'favicon.svg' ||
                "$relative" =~ ^assets/[A-Za-z0-9._-]+\.(js|css)$ ||
                "$relative" =~ ^art/[A-Za-z0-9._-]+\.png$ ]] || {
                printf 'Unexpected output file: %s\n' "$relative" >&2
                exit 1
              }
            else
              printf 'Link or special output entry: %s\n' "$relative" >&2
              exit 1
            fi
          done < <(find dist -mindepth 1 -print0)

          (( $(find dist/art -maxdepth 1 -type f -name '*.png' 2>/dev/null | wc -l) <= 64 ))

          mapfile -t javascript_files < <(find dist/assets -maxdepth 1 -type f -name '*.js' -printf '%f\n')
          mapfile -t stylesheet_files < <(find dist/assets -maxdepth 1 -type f -name '*.css' -printf '%f\n')
          (( ${#javascript_files[@]} == 1 ))
          (( ${#stylesheet_files[@]} == 1 ))

          javascript_file="${javascript_files[0]}"
          stylesheet_file="${stylesheet_files[0]}"
          grep -Fq "/assets/$javascript_file" dist/index.html
          grep -Fq "/assets/$stylesheet_file" dist/index.html
          grep -Fq '/art/playne-logo.png' dist/index.html
          grep -Fq 'Playne — небольшие игры' dist/index.html
          grep -Fq 'На глаз — игра в размеры | Playne' dist/naglaz/index.html
          grep -Fq 'https://mc.yandex.ru/watch/112711950' dist/index.html
          grep -Fq 'https://mc.yandex.ru/metrika/tag.js?id=' "dist/assets/$javascript_file"
          grep -Fq '112711950' "dist/assets/$javascript_file"
          grep -Fq 'naglaz_game_complete' "dist/assets/$javascript_file"
          ! grep -Eq '(src|href)="/naglaz/' dist/index.html

          printf 'javascript_file=%s\n' "$javascript_file" >> "$GITHUB_OUTPUT"
          printf 'stylesheet_file=%s\n' "$stylesheet_file" >> "$GITHUB_OUTPUT"
          printf 'index_digest=%s\n' "$(sha256sum dist/index.html | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          printf 'favicon_digest=%s\n' "$(sha256sum dist/favicon.svg | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          printf 'javascript_digest=%s\n' "$(sha256sum "dist/assets/$javascript_file" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          printf 'stylesheet_digest=%s\n' "$(sha256sum "dist/assets/$stylesheet_file" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Package an immutable release
        id: package
        run: |
          set -Eeuo pipefail
          package_root="$RUNNER_TEMP/package"
          install -d "$package_root/naglaz"
          cp -a dist/. "$package_root/naglaz/"
          printf '%s\n' "$GITHUB_SHA" > "$package_root/REVISION"

          archive="$RUNNER_TEMP/$GITHUB_SHA.tar.gz"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          tar \
            --create \
            --directory "$package_root" \
            --sort=name \
            --mtime="@$source_date_epoch" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            REVISION naglaz | gzip -n > "$archive"

          digest="$(sha256sum "$archive" | awk '{print $1}')"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Upload and activate the release
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          ARCHIVE_DIGEST: ${{ steps.package.outputs.digest }}
          DEPLOY_HOST: ${{ secrets.NAGLAZ_VPS_HOST }}
          DEPLOY_PRIVATE_KEY_B64: ${{ secrets.NAGLAZ_VPS_SSH_KEY_B64 }}
          DEPLOY_KNOWN_HOSTS_B64: ${{ secrets.NAGLAZ_VPS_KNOWN_HOSTS_B64 }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARCHIVE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test -n "$DEPLOY_PRIVATE_KEY_B64"
          test -n "$DEPLOY_KNOWN_HOSTS_B64"
          test -f "$ARCHIVE"

          key_file="$RUNNER_TEMP/naglaz_deploy_key"
          known_hosts_file="$RUNNER_TEMP/naglaz_known_hosts"
          cleanup_ssh() { rm -f -- "$key_file" "$known_hosts_file"; }
          trap cleanup_ssh EXIT
          (umask 077 && printf '%s' "$DEPLOY_PRIVATE_KEY_B64" | base64 --decode > "$key_file")
          (umask 077 && printf '%s' "$DEPLOY_KNOWN_HOSTS_B64" | base64 --decode > "$known_hosts_file")
          ssh-keygen -y -f "$key_file" >/dev/null
          ssh-keygen -F "$DEPLOY_HOST" -f "$known_hosts_file" >/dev/null

          ssh_options=(
            -T
            -F /dev/null
            -p 22
            -i "$key_file"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            -o GlobalKnownHostsFile=/dev/null
            -o "UserKnownHostsFile=$known_hosts_file"
            -o ClearAllForwardings=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=3
          )
          destination="naglaz-deploy@$DEPLOY_HOST"

          ssh "${ssh_options[@]}" "$destination" \
            "upload $GITHUB_SHA $ARCHIVE_DIGEST" < "$ARCHIVE"
          ssh "${ssh_options[@]}" "$destination" \
            "deploy $GITHUB_SHA $ARCHIVE_DIGEST"
          ssh "${ssh_options[@]}" "$destination" \
            "status $GITHUB_SHA $ARCHIVE_DIGEST"

      - name: Verify production
        env:
          FAVICON_DIGEST: ${{ steps.assets.outputs.favicon_digest }}
          INDEX_DIGEST: ${{ steps.assets.outputs.index_digest }}
          JAVASCRIPT_DIGEST: ${{ steps.assets.outputs.javascript_digest }}
          JAVASCRIPT_FILE: ${{ steps.assets.outputs.javascript_file }}
          STYLESHEET_DIGEST: ${{ steps.assets.outputs.stylesheet_digest }}
          STYLESHEET_FILE: ${{ steps.assets.outputs.stylesheet_file }}
        run: |
          set -Eeuo pipefail
          index_file="$RUNNER_TEMP/naglaz-index.html"
          index_headers="$RUNNER_TEMP/naglaz-index.headers"
          favicon_file="$RUNNER_TEMP/naglaz-favicon.svg"
          javascript_file="$RUNNER_TEMP/naglaz-app.js"
          stylesheet_file="$RUNNER_TEMP/naglaz-app.css"

          curl --fail --silent --show-error --max-time 20 \
            --dump-header "$index_headers" \
            https://playne.ru/ --output "$index_file"
          test "$(sha256sum "$index_file" | awk '{print $1}')" = "$INDEX_DIGEST"
          tr -d '\r' < "$index_headers" | \
            grep -Eiq "^content-security-policy:.*script-src.*mc\.yandex\.ru.*connect-src.*mc\.yandex\.ru"
          ! tr -d '\r' < "$index_headers" | grep -Eiq '^content-security-policy:.*sandbox'

          curl --fail --silent --show-error --max-time 20 \
            https://playne.ru/favicon.svg --output "$favicon_file"
          test "$(sha256sum "$favicon_file" | awk '{print $1}')" = "$FAVICON_DIGEST"

          curl --fail --silent --show-error --max-time 20 \
            "https://playne.ru/assets/$JAVASCRIPT_FILE" \
            --output "$javascript_file"
          test "$(sha256sum "$javascript_file" | awk '{print $1}')" = "$JAVASCRIPT_DIGEST"

          curl --fail --silent --show-error --max-time 20 \
            "https://playne.ru/assets/$STYLESHEET_FILE" \
            --output "$stylesheet_file"
          test "$(sha256sum "$stylesheet_file" | awk '{print $1}')" = "$STYLESHEET_DIGEST"

          # HTTP 200 alone misses CORP/CORS failures inside the CSP sandbox.
          for artwork in dist/art/*.png; do
            artwork_file="$RUNNER_TEMP/naglaz-artwork.png"
            artwork_headers="$RUNNER_TEMP/naglaz-artwork.headers"
            curl --fail --silent --show-error --max-time 20 \
              --header 'Origin: null' --dump-header "$artwork_headers" \
              "https://playne.ru/art/$(basename "$artwork")" \
              --output "$artwork_file"
            cmp "$artwork" "$artwork_file"
            tr -d '\r' < "$artwork_headers" | grep -Eiq '^content-type: image/png'
            tr -d '\r' < "$artwork_headers" | grep -Eiq '^access-control-allow-origin: \*$'
            tr -d '\r' < "$artwork_headers" | grep -Eiq '^cross-origin-resource-policy: cross-origin$'
          done

          game_file="$RUNNER_TEMP/playne-naglaz.html"
          curl --fail --silent --show-error --max-time 20 \
            https://playne.ru/naglaz/ --output "$game_file"
          cmp dist/naglaz/index.html "$game_file"
          game_redirect="$(curl --silent --show-error --max-time 20 \
            --output /dev/null --write-out '%{http_code}|%{redirect_url}' \
            https://playne.ru/naglaz)"
          test "$game_redirect" = '308|https://playne.ru/naglaz/'

          root_result="$(curl --silent --show-error --max-time 20 \
            --output /dev/null --write-out '%{http_code}|%{redirect_url}' \
            https://www.playne.ru/)"
          test "$root_result" = '308|https://playne.ru/'

          canonical_result="$(curl --silent --show-error --max-time 20 \
            --output /dev/null --write-out '%{http_code}|%{redirect_url}' \
            https://kadimag.ru/naglaz/)"
          test "$canonical_result" = '308|https://playne.ru/naglaz/'

          boundary_status="$(curl --silent --show-error --max-time 20 \
            --output /dev/null --write-out '%{http_code}' \
            https://kadimag.ru/naglaz-private-probe)"
          test "$boundary_status" = 307
